name: Release

# 打 tag（v*）触发：四平台构建应用包 → 自动创建 GitHub Release
# 手动触发：Actions 页面 Run workflow
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest        # Apple Silicon
            label: macos-arm64
            asset: callfans-macos-arm64.zip
            arch: arm64
          - os: macos-latest        # Intel Mac（Intel runner 已退役；arm64 runner
            label: macos-x64        #  + Rosetta 装 x64 Python 交叉构建）
            asset: callfans-macos-x64.zip
            arch: x64
          - os: windows-latest
            label: windows-x64
            asset: callfans-windows-x64.zip
            arch: x64
          - os: ubuntu-latest       # 无桌面版（CLI + serve）
            label: linux-x64
            asset: callfans-linux-x64.tar.gz
            arch: x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.arch }}

      - name: Offline tests (打包前冒烟)
        env:
          PYTHONUTF8: "1"        # Windows 控制台默认 cp1252，中文输出需 UTF-8 模式
          PYTHONIOENCODING: utf-8
        run: |
          python demo/run_demo.py
          python demo/run_memory_demo.py
          python demo/run_executor_adapter_demo.py

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build single-file binary
        shell: bash
        run: |
          SEP=":"
          if [ "$RUNNER_OS" = "Windows" ]; then SEP=";"; fi
          pyinstaller --onefile --name callfans \
            --collect-submodules kb \
            --add-data "kb/static${SEP}kb/static" \
            --clean --noconfirm callfans.py

      # macOS：ad-hoc 签名（避免用户防火墙静默拦截未签名后台进程的入站连接；
      # 首次运行系统可能仍会询问"允许传入连接"，属正常）
      - name: Ad-hoc codesign (macOS)
        if: runner.os == 'macOS'
        run: codesign --force --sign - dist/callfans

      - name: Package (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p release/docs release/deploy
          cp dist/callfans release/
          cp README.md LICENSE release/
          cp docs/*.md release/docs/
          cp deploy/callfans.service release/deploy/
          if [ "$RUNNER_OS" = "Linux" ]; then
            tar -czf "${{ matrix.asset }}" -C release .
          else
            zip -r "${{ matrix.asset }}" -j release/callfans \
              && zip -r "${{ matrix.asset }}" README.md LICENSE docs deploy
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release\docs, release\deploy | Out-Null
          Copy-Item dist\callfans.exe release\
          Copy-Item README.md, LICENSE release\
          Copy-Item docs\*.md release\docs\
          Copy-Item deploy\callfans.service release\deploy\
          Compress-Archive -Path release\* -DestinationPath ${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  desktop:
    name: desktop (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: desktop-macos-arm64
            py-arch: arm64
            rust-target: aarch64-apple-darwin
            asset: callfans-desktop-macos-arm64.dmg
          - os: macos-latest          # Intel：Rosetta x64 Python + cargo 交叉
            label: desktop-macos-x64
            py-arch: x64
            rust-target: x86_64-apple-darwin
            asset: callfans-desktop-macos-x64.dmg
          - os: windows-latest
            label: desktop-windows
            py-arch: x64
            rust-target: x86_64-pc-windows-msvc
            asset: callfans-desktop-windows-x64-setup.exe
          - os: ubuntu-latest
            label: desktop-linux
            py-arch: x64
            rust-target: x86_64-unknown-linux-gnu
            asset: callfans-desktop-linux-x64.deb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.11", architecture: "${{ matrix.py-arch }}" }

      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.rust-target }}" }

      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: Linux 系统依赖（webkit2gtk）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Build sidecar (PyInstaller)
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          pip install pyinstaller
          SEP=":"; if [ "$RUNNER_OS" = "Windows" ]; then SEP=";"; fi
          pyinstaller --onefile --name callfans --collect-submodules kb \
            --add-data "kb/static${SEP}kb/static" --clean --noconfirm callfans.py
          mkdir -p tauri-app/src-tauri/binaries
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp dist/callfans.exe tauri-app/src-tauri/binaries/callfans.exe
          else
            cp dist/callfans tauri-app/src-tauri/binaries/callfans
          fi

      - name: Build desktop bundle (Tauri)
        working-directory: tauri-app
        run: |
          npm install
          npx tauri build --target ${{ matrix.rust-target }}

      - name: Collect asset (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        working-directory: tauri-app
        run: |
          cp "$(find src-tauri/target -name '*.dmg' -o -name '*.deb' | head -1)" \
            "${{ github.workspace }}/${{ matrix.asset }}"

      - name: Collect asset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri\target -Recurse -Filter '*setup.exe' | Select-Object -First 1
          Copy-Item $exe.FullName "${{ github.workspace }}\${{ matrix.asset }}"
        working-directory: tauri-app

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    name: create release
    needs: [build, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/callfans-macos-arm64.zip
            dist/callfans-macos-x64.zip
            dist/callfans-windows-x64.zip
            dist/callfans-linux-x64.tar.gz
            dist/callfans-desktop-macos-arm64.dmg
            dist/callfans-desktop-macos-x64.dmg
            dist/callfans-desktop-windows-x64-setup.exe
            dist/callfans-desktop-linux-x64.deb
